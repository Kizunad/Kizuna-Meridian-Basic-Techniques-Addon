plugins { id 'fabric-loom' }

description = '独立 GameTest 装配，验证真实目录、按卷学习和原版数据注册表。'

dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    // 相邻仓库在 settings 中以源码组合；与原先读单个 JAR 一致只取各模块本身，传递库由完整装配在运行时补齐。
    modImplementation('dev.kizuna.meridian.human:fabric') { transitive = false }
    implementation project(':verification')
    modCompileOnly('dev.kizuna.meridian.vanilla:fabric') { transitive = false }
    modImplementation('dev.kizuna.meridian.technique:fabric') { transitive = false }
    modCompileOnly('dev.kizuna.meridian.combat:fabric') { transitive = false }
    compileOnly('dev.kizuna.meridian.combat:shared') { transitive = false }
    modCompileOnly('dev.kizuna.meridian.humanoid:fabric') { transitive = false }
    compileOnly('dev.kizuna.meridian.humanoid:server') { transitive = false }
    // 测试入口与正式数据包分开加载，验证发行包自己的清单发现。
    modLocalRuntime files(project(':fabric').tasks.named('jar'))
}

loom {
    mods {
        meridian_basic_techniques_test { sourceSet sourceSets.main }
    }
    runs {
        gametest {
            server()
            name '基础功法数据 GameTest'
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
