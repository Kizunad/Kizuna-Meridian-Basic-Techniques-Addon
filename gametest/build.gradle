plugins { id 'net.fabricmc.fabric-loom' }

description = '独立 GameTest 装配，验证真实目录、按卷学习和原版数据注册表。'

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    // 相邻仓库在 settings 中以源码组合；与原先读单个 JAR 一致只取各模块本身，传递库由完整装配在运行时补齐。
    implementation('dev.kizuna.meridian.human:fabric') { transitive = false }
    implementation project(':verification')
    compileOnly('dev.kizuna.meridian.vanilla:fabric') { transitive = false }
    implementation('dev.kizuna.meridian.technique:fabric') { transitive = false }
    // 登录假玩家夹具来自功法库的 testFixtures，与功法 fabric 同经源码组合解析。
    implementation testFixtures('dev.kizuna.meridian.technique:fabric')
    // 26.2 的战斗与跃步通道是 Framework 的 ProtobufChannel，测试按通道构造载荷；运行时由完整装配提供。
    compileOnly('dev.kizuna.meridian:fabric') { transitive = false }
    compileOnly('dev.kizuna.meridian.combat:fabric') { transitive = false }
    compileOnly('dev.kizuna.meridian.combat:shared') { transitive = false }
    compileOnly('dev.kizuna.meridian.humanoid:fabric') { transitive = false }
    compileOnly('dev.kizuna.meridian.humanoid:server') { transitive = false }
    // 测试入口与正式数据包分开加载，验证发行包自己的清单发现。Gradle 9 的依赖块里 project() 返回依赖对象，
    // 所以从根工程取 fabric 工程的 jar 任务。
    localRuntime files(rootProject.project(':fabric').tasks.named('jar'))
}

loom {
    mods {
        meridian_basic_techniques_test { sourceSet sourceSets.main }
    }
    runs {
        gametest {
            server()
            name '基础功法数据 GameTest'
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

tasks.named('runGametest') {
    doFirst {
        // 每局从空目录新建世界：GameTest 服务端按自带的平坦预设建世界，旧目录只会累积上一局的区块、实体、假玩家与模组存档。
        // 26.2 把生成设置与游戏规则拆到了 data/minecraft，只留 level.dat 会退回随机种子的默认地形，所以整个目录删掉。
        file('build/gametest/world').deleteDir()
    }
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
